[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "instrument-agnostic-amt"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dlchordx",
    "einops",
    "mido",
    "numpy",
    "pretty-midi",
    "pyyaml",
    "scipy",
    "soundfile",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "tqdm",
    "triton-windows>=3.7.1.post27,<3.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
evaluation = [
    "mir-eval",
]
stem = [
    "chord-romanizer",
    "librosa",
    "stem-splitter",
]
training = [
    "audiomentations",
    "pedalboard",
    "tensorboard",
    "torch-optimizer",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest",
    "tomli; python_version < '3.11'",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["instrument_agnostic_amt"]
exclude = ["**/.DS_Store"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
